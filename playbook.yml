- hosts: servers
  vars:
    user: "docker_runner"
    nginx_proxy_cache_path: "/var/cache/nginx keys_zone=my_cache:10m"
    database_url: "jdbc:postgresql://postgres:5432/{{ db_name }}"
    docker_users:
      - "{{ user }}"
    docker_install_compose_plugin: true
    certbot_install_method: package
    certbot_create_if_missing: true
    certbot_admin_email: "{{ admin_email }}"
    certbot_create_method: standalone
    certbot_auto_renew_user: root
    certbot_certs:
      - domains:
        - "{{ domain }}"
  
  pre_tasks:
      - name: Install ACL support for Ansible become
        become: true
        ansible.builtin.apt:
          name: acl
          state: present
          update_cache: true

      - name: Create Docker runner user
        become: true
        ansible.builtin.user:
          name: "{{ user }}"
          state: present

      - name: Create directories - logs, data, images
        become: true
        ansible.builtin.file:
          path: "{{ item }}"
          state: directory
          owner: "{{ user }}"
          group: "{{ user }}"
          mode: "0755"
        loop:
          - /opt/bulletin-board/logs
          - /opt/bulletin-board/data
          - /opt/bulletin-board/postgres
          - /opt/bulletin-board/uploads

  roles: 
    - role: geerlingguy.docker
      become: true

  tasks:
    - name: Create docker network - internal
      become: true
      become_user: "{{ user }}"
      community.docker.docker_network:
        name: network_one
        internal: true
        state: present

    - name: Create docker network - external
      become: true
      become_user: "{{ user }}"
      community.docker.docker_network:
        name: network_second
        state: present

    - name: Run posgres db
      ansible.builtin.include_role:
        name: run_postgres_container

    - name: Deploy application
      ansible.builtin.include_role:
        name: run_app_container

    - name: Install and run nginx
      ansible.builtin.include_role:
        name: geerlingguy.nginx
        apply:
          become: true

    - name: Copy nginx.conf
      ansible.builtin.template:
        src: files/nginx.conf.j2
        dest: /etc/nginx/conf.d/default.conf
      become: true
      notify:
        - check nginx
        - restart nginx
      tags: copy-conf

    - name: certbot
      ansible.builtin.include_role:
        name: geerlingguy.certbot
        apply:
          become: true

    - name: reload nginx manually
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: true
      tags: reload_nginx

    - name: restart app
      ansible.builtin.command:
        cmd: docker restart bulletin-app
      become: true
      become_user: "{{ user }}"
      tags: "restart_app"

    - name: restart db
      ansible.builtin.command:
        cmd: docker restart postgres
      become: true
      become_user: "{{ user }}"
      tags: "restart_db"
      
  handlers:
    - name: check nginx
      ansible.builtin.command:
        cmd: nginx -t
      become: true
      changed_when: false

    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: true
